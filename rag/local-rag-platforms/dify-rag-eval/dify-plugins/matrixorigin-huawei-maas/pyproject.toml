[project]
name = "matrixorigin-huawei-maas"
version = "0.0.1"
description = "MatrixOrigin Huawei Cloud MaaS model provider for Dify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dify_plugin>=0.9.0,<0.10.0",
    "httpx>=0.28.1,<0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
