provider: huawei_maas
label:
  en_US: Huawei Cloud MaaS
  zh_Hans: 华为云 MaaS
description:
  en_US: Text-only Huawei Cloud MaaS GLM chat and BGE-M3 embeddings.
  zh_Hans: 仅文本的华为云 MaaS GLM 对话与 BGE-M3 嵌入。
icon_small:
  en_US: icon.svg
  zh_Hans: icon.svg
icon_large:
  en_US: icon.svg
  zh_Hans: icon.svg
background: "#CF0A2C"
help:
  title:
    en_US: Huawei Cloud MaaS API documentation
    zh_Hans: 华为云 MaaS API 文档
  url:
    en_US: https://support.huaweicloud.com/intl/en-us/api-maas/api-maas-0002.html
    zh_Hans: https://support.huaweicloud.com/api-maas/api-maas-0002.html
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your Huawei Cloud MaaS API key
        zh_Hans: 输入华为云 MaaS API Key
    - variable: base_url
      label:
        en_US: Base URL
        zh_Hans: Base URL
      type: text-input
      required: true
      default: https://api.modelarts-maas.com/v1
      placeholder:
        en_US: https://api.modelarts-maas.com/v1
        zh_Hans: https://api.modelarts-maas.com/v1
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter the Huawei Cloud MaaS model name
      zh_Hans: 输入华为云 MaaS 模型名称
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
    - variable: base_url
      label:
        en_US: Base URL
        zh_Hans: Base URL
      type: text-input
      required: true
      default: https://api.modelarts-maas.com/v1
    - variable: context_size
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      type: text-input
      required: true
      default: "8192"
models:
  llm:
    predefined:
      - models/llm/*.yaml
    position: models/llm/_position.yaml
  text_embedding:
    predefined:
      - models/text_embedding/*.yaml
    position: models/text_embedding/_position.yaml
extra:
  python:
    provider_source: provider/huawei_maas.py
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
