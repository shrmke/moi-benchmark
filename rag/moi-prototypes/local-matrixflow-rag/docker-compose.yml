services:
  matrixone:
    image: matrixorigin/matrixone:4.1.4
    ports:
      - "6001:6001"
    volumes:
      - matrixone-data:/mo-data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9876/debug/pprof/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  matrixone-data:
